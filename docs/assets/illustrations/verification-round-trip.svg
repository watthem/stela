<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Anyone with the source can verify a chunk.</title>
  <desc id="description">A source byte slice from 9 to 62 is hashed independently and matches the stored chunk hash.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F5A623"/>
    </marker>
    <style>
      .bg { fill: #0a0a0a; }
      .box { fill: #111111; stroke: #2c2b28; stroke-width: 1.5; }
      .raised { fill: #181817; stroke: #2c2b28; stroke-width: 1.5; }
      .amber-box { fill: #251b0d; stroke: #F5A623; stroke-width: 2; }
      .green-box { fill: #122014; stroke: #5CB85C; stroke-width: 2; }
      .red-box { fill: #241313; stroke: #E06060; stroke-width: 2; }
      .title { fill: #e8e6e1; font: 600 36px 'Space Grotesk', Inter, Arial, sans-serif; letter-spacing: -0.7px; }
      .kicker { fill: #F5A623; font: 600 12px 'Space Mono', ui-monospace, monospace; letter-spacing: 1.8px; }
      .label { fill: #e8e6e1; font: 600 17px 'Space Grotesk', Inter, Arial, sans-serif; }
      .body { fill: #e8e6e1; font: 400 15px 'Space Grotesk', Inter, Arial, sans-serif; }
      .small { fill: #8a8880; font: 400 12px 'Space Grotesk', Inter, Arial, sans-serif; }
      .mono { fill: #e8e6e1; font: 400 13px 'Space Mono', ui-monospace, monospace; }
      .mono-dim { fill: #8a8880; font: 400 12px 'Space Mono', ui-monospace, monospace; }
      .mono-amber { fill: #F5A623; font: 600 13px 'Space Mono', ui-monospace, monospace; }
      .mono-green { fill: #5CB85C; font: 600 13px 'Space Mono', ui-monospace, monospace; }
      .mono-red { fill: #E06060; font: 600 13px 'Space Mono', ui-monospace, monospace; }
      .line { stroke: #2c2b28; stroke-width: 1.5; }
      .amber-line { stroke: #F5A623; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #8a8880; stroke-width: 1.5; stroke-dasharray: 5 6; fill: none; }
      .watermark { fill: #8a8880; font: 500 11px 'Space Mono', ui-monospace, monospace; letter-spacing: 1px; }
    </style>
  </defs>
  <rect width="1200" height="675" class="bg"/>
  <text x="50" y="45" class="kicker" text-anchor="start">03 / VERIFICATION ROUND TRIP</text>
  <text x="50" y="88" class="title" text-anchor="start">Anyone with the source can verify a chunk.</text>
  <text x="1150" y="48" class="watermark" text-anchor="end">STELA / PROVENANCE</text>
  <line x1="50" y1="108" x2="1150" y2="108" class="line"/>
  
    <rect x="50" y="176" width="292" height="320" rx="6" class="box"/>
    <text x="76" y="210" class="kicker" text-anchor="start">1  SOURCE</text>
    <text x="76" y="246" class="label" text-anchor="start">example-source.md</text>
    <text x="76" y="292" class="mono-dim" text-anchor="start">0</text>
    <line x1="102" y1="288" x2="306" y2="288" class="line"/>
    <text x="76" y="337" class="mono-amber" text-anchor="start">9</text>
    <rect x="102" y="309" width="204" height="82" rx="4" fill="#251b0d" stroke="#F5A623"/>
    <text x="117" y="338" class="mono" text-anchor="start">First paragraph has</text>
    <text x="117" y="362" class="mono" text-anchor="start">café text…</text>
    <text x="76" y="416" class="mono-amber" text-anchor="start">62</text>
    <line x1="102" y1="412" x2="306" y2="412" class="line"/>
    <text x="76" y="466" class="mono-dim" text-anchor="start">109</text>

    <rect x="454" y="176" width="292" height="320" rx="6" class="amber-box"/>
    <text x="480" y="210" class="kicker" text-anchor="start">2  CHUNK</text>
    <text x="480" y="248" class="mono" text-anchor="start">First paragraph has café</text>
    <text x="480" y="272" class="mono" text-anchor="start">text. It has two sentences.</text>
    <line x1="480" y1="295" x2="720" y2="295" class="line"/>
    <text x="480" y="329" class="mono-dim" text-anchor="start">byte range</text>
    <text x="598" y="329" class="mono-amber" text-anchor="start">[9, 62)</text>
    <text x="480" y="365" class="mono-dim" text-anchor="start">stored hash</text>
    <text x="480" y="389" class="mono" text-anchor="start">3c8be60d3ed3537d…</text>
    <text x="480" y="438" class="small" text-anchor="start">No stela runtime is needed</text>
    <text x="480" y="459" class="small" text-anchor="start">to check this metadata.</text>

    <rect x="858" y="176" width="292" height="320" rx="6" class="green-box"/>
    <text x="884" y="210" class="kicker" text-anchor="start">3  INDEPENDENT CHECK</text>
    <text x="884" y="253" class="mono" text-anchor="start">slice = bytes[9:62]</text>
    <text x="884" y="291" class="mono" text-anchor="start">hash = sha256(slice)</text>
    <line x1="884" y1="318" x2="1124" y2="318" class="line"/>
    <text x="884" y="355" class="mono-dim" text-anchor="start">stored</text>
    <text x="1124" y="355" class="mono" text-anchor="end">3c8be60d…</text>
    <text x="884" y="387" class="mono-dim" text-anchor="start">computed</text>
    <text x="1124" y="387" class="mono" text-anchor="end">3c8be60d…</text>
    <rect x="884" y="417" width="240" height="48" rx="6" class="green-box"/>
    <text x="1004" y="447" class="mono-green" text-anchor="middle">MATCH  ✓</text>

    <path d="M 342 336 C 390 336, 401 336, 444 336" class="amber-line"/>
    <path d="M 746 336 C 794 336, 805 336, 848 336" class="amber-line"/>
    <path d="M 1004 510 C 1004 575, 196 575, 196 506" class="dash" marker-end="url(#arrow)"/>
    <text x="600" y="612" class="mono-amber" text-anchor="middle">THE METADATA SURVIVES AN INDEPENDENT ROUND TRIP</text>
  
</svg>
