<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Choose boundaries without giving up provenance.</title>
  <desc id="description">The same 109-byte fixture is split by paragraph, heading, sentence, and six-word strategies, each with verified ranges.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F5A623"/>
    </marker>
    <style>
      .bg { fill: #0a0a0a; }
      .box { fill: #111111; stroke: #2c2b28; stroke-width: 1.5; }
      .raised { fill: #181817; stroke: #2c2b28; stroke-width: 1.5; }
      .amber-box { fill: #251b0d; stroke: #F5A623; stroke-width: 2; }
      .green-box { fill: #122014; stroke: #5CB85C; stroke-width: 2; }
      .red-box { fill: #241313; stroke: #E06060; stroke-width: 2; }
      .title { fill: #e8e6e1; font: 600 36px 'Space Grotesk', Inter, Arial, sans-serif; letter-spacing: -0.7px; }
      .kicker { fill: #F5A623; font: 600 12px 'Space Mono', ui-monospace, monospace; letter-spacing: 1.8px; }
      .label { fill: #e8e6e1; font: 600 17px 'Space Grotesk', Inter, Arial, sans-serif; }
      .body { fill: #e8e6e1; font: 400 15px 'Space Grotesk', Inter, Arial, sans-serif; }
      .small { fill: #8a8880; font: 400 12px 'Space Grotesk', Inter, Arial, sans-serif; }
      .mono { fill: #e8e6e1; font: 400 13px 'Space Mono', ui-monospace, monospace; }
      .mono-dim { fill: #8a8880; font: 400 12px 'Space Mono', ui-monospace, monospace; }
      .mono-amber { fill: #F5A623; font: 600 13px 'Space Mono', ui-monospace, monospace; }
      .mono-green { fill: #5CB85C; font: 600 13px 'Space Mono', ui-monospace, monospace; }
      .mono-red { fill: #E06060; font: 600 13px 'Space Mono', ui-monospace, monospace; }
      .line { stroke: #2c2b28; stroke-width: 1.5; }
      .amber-line { stroke: #F5A623; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #8a8880; stroke-width: 1.5; stroke-dasharray: 5 6; fill: none; }
      .watermark { fill: #8a8880; font: 500 11px 'Space Mono', ui-monospace, monospace; letter-spacing: 1px; }
    </style>
  </defs>
  <rect width="1200" height="675" class="bg"/>
  <text x="50" y="45" class="kicker" text-anchor="start">05 / STRATEGY COMPARISON</text>
  <text x="50" y="88" class="title" text-anchor="start">Choose boundaries without giving up provenance.</text>
  <text x="1150" y="48" class="watermark" text-anchor="end">STELA / PROVENANCE</text>
  <line x1="50" y1="108" x2="1150" y2="108" class="line"/>
  
    <rect x="50" y="137" width="1100" height="76" rx="6" class="raised"/>
    <text x="72" y="166" class="kicker" text-anchor="start">SAME 109-BYTE SOURCE</text>
    <text x="72" y="194" class="mono" text-anchor="start"># Alpha  ·  First paragraph has café text. It has two sentences.  ·  ## Beta  ·  Second paragraph…</text>
    
    <rect x="50" y="246" width="260" height="310" rx="6" class="box"/>
    <text x="72" y="280" class="kicker" text-anchor="start">PARAGRAPH</text>
    <text x="72" y="307" class="small" text-anchor="start">blank lines</text>
    <rect x="72" y="322" width="216" height="31" rx="3" class="raised"/><text x="84" y="343" class="mono" text-anchor="start">P1  [0, 7)</text><rect x="72" y="364" width="216" height="31" rx="3" class="box"/><text x="84" y="385" class="mono" text-anchor="start">P2  [9, 62)</text><rect x="72" y="406" width="216" height="31" rx="3" class="raised"/><text x="84" y="427" class="mono" text-anchor="start">P3  [64, 71)</text><rect x="72" y="448" width="216" height="31" rx="3" class="box"/><text x="84" y="469" class="mono" text-anchor="start">P4  [73, 109)</text>
    <text x="288" y="534" class="mono-green" text-anchor="end">VERIFIED ✓</text>
  
    <rect x="330" y="246" width="260" height="310" rx="6" class="box"/>
    <text x="352" y="280" class="kicker" text-anchor="start">HEADING</text>
    <text x="352" y="307" class="small" text-anchor="start"># sections</text>
    <rect x="352" y="322" width="216" height="31" rx="3" class="raised"/><text x="364" y="343" class="mono" text-anchor="start">H1  [0, 62)</text><rect x="352" y="364" width="216" height="31" rx="3" class="box"/><text x="364" y="385" class="mono" text-anchor="start">H2  [64, 109)</text>
    <text x="568" y="534" class="mono-green" text-anchor="end">VERIFIED ✓</text>
  
    <rect x="610" y="246" width="260" height="310" rx="6" class="box"/>
    <text x="632" y="280" class="kicker" text-anchor="start">SENTENCE</text>
    <text x="632" y="307" class="small" text-anchor="start">sentence boundaries</text>
    <rect x="632" y="322" width="216" height="31" rx="3" class="raised"/><text x="644" y="343" class="mono" text-anchor="start">S1  [0, 7)</text><rect x="632" y="364" width="216" height="31" rx="3" class="box"/><text x="644" y="385" class="mono" text-anchor="start">S2  [9, 40)</text><rect x="632" y="406" width="216" height="31" rx="3" class="raised"/><text x="644" y="427" class="mono" text-anchor="start">S3  [41, 62)</text><rect x="632" y="448" width="216" height="31" rx="3" class="box"/><text x="644" y="469" class="mono" text-anchor="start">S4  [64, 71)</text><rect x="632" y="490" width="216" height="31" rx="3" class="raised"/><text x="644" y="511" class="mono" text-anchor="start">S5  [73, 109)</text>
    <text x="848" y="534" class="mono-green" text-anchor="end">VERIFIED ✓</text>
  
    <rect x="890" y="246" width="260" height="310" rx="6" class="amber-box"/>
    <text x="912" y="280" class="kicker" text-anchor="start">WORD · 6</text>
    <text x="912" y="307" class="small" text-anchor="start">word-count groups</text>
    <rect x="912" y="322" width="216" height="31" rx="3" class="raised"/><text x="924" y="343" class="mono" text-anchor="start">W1  [0, 34)</text><rect x="912" y="364" width="216" height="31" rx="3" class="box"/><text x="924" y="385" class="mono" text-anchor="start">W2  [35, 66)</text><rect x="912" y="406" width="216" height="31" rx="3" class="raised"/><text x="924" y="427" class="mono" text-anchor="start">W3  [67, 109)</text>
    <text x="1128" y="534" class="mono-green" text-anchor="end">VERIFIED ✓</text>
  
    <text x="600" y="602" class="mono-amber" text-anchor="middle">BOUNDARIES CHANGE. BYTE PROVENANCE DOES NOT.</text>
  
</svg>
